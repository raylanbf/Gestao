<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manual da API — CSC Dashboard</title>
  <style>
    :root {
      --azul: #2563eb;
      --azul-h: #1d4ed8;
      --borda: #e5e7eb;
      --cinza: #6b7280;
      --bg: #f9fafb;
      --code-bg: #0f172a;
    }
    * { box-sizing: border-box; }
    body {
      font: 14px/1.55 system-ui, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      background: var(--bg);
      color: #111827;
    }
    #app { max-width: 900px; margin: 0 auto; padding: 28px 22px 80px; }
    h1 { font-size: 24px; margin: 0 0 6px; }
    h2 { font-size: 18px; margin: 34px 0 10px; padding-top: 10px; border-top: 1px solid var(--borda); }
    h3 { font-size: 15px; margin: 0 0 6px; color: var(--azul-h); }
    h4 { font-size: 13px; margin: 14px 0 6px; color: #374151; text-transform: uppercase; letter-spacing: .04em; }
    p.desc { color: #374151; margin: 6px 0; }
    p.hint { color: var(--cinza); font-size: 12px; margin: 4px 0; }

    .meta { display: flex; gap: 8px; margin: 6px 0 4px; }
    .badge { background: #eef2ff; color: var(--azul-h); border: 1px solid #e0e7ff; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }

    section.endpoint {
      background: #fff; border: 1px solid var(--borda); border-radius: 10px;
      padding: 16px; margin: 14px 0;
    }
    .ep-linha { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .metodo { color: #fff; border-radius: 6px; padding: 3px 10px; font-weight: 700; font-size: 12px; }
    .metodo.post { background: #16a34a; }
    .metodo.get { background: #2563eb; }
    .ep-url { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 13px; word-break: break-all; }
    .sub { margin: 8px 0; }
    .sub code { background: #f3f4f6; padding: 1px 6px; border-radius: 4px; font-size: 12.5px; }

    section.schema {
      background: #fff; border: 1px solid var(--borda); border-radius: 10px;
      padding: 14px 16px; margin: 12px 0;
    }
    table.campos { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    table.campos th, table.campos td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #f0f1f3; vertical-align: top; }
    table.campos th { color: var(--cinza); font-weight: 600; font-size: 12px; }
    td.campo { font-family: ui-monospace, Consolas, monospace; font-weight: 600; white-space: nowrap; }
    td.tipo code { background: #f3f4f6; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
    td.tipo a { color: var(--azul); text-decoration: none; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
    td.tipo a:hover { text-decoration: underline; }
    .null { color: #b45309; font-size: 11px; }
    td.obr { color: var(--cinza); }
    td.descr { color: #374151; }

    pre.exemplo {
      background: var(--code-bg); color: #e2e8f0; border-radius: 8px;
      padding: 14px; overflow: auto; font-size: 12.5px; line-height: 1.5;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    }
    a.top { position: fixed; right: 18px; bottom: 18px; background: var(--azul); color: #fff; border-radius: 999px; padding: 8px 14px; text-decoration: none; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  </style>
</head>
<body>
  <div id="app">Carregando…</div>
  <a class="top" href="#app">↑ topo</a>
  <script src="manual.js"></script>
</body>
</html>
